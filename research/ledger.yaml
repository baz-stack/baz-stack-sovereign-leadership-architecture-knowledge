entries:
- id: RA-01
  subject: Entanglement - EPR 1935
  claim: Einstein showed particles can be mysteriously linked across distance; quantum physics proves everything
    is connected.
  source_citation: 'Einstein, Podolsky, Rosen. ''Can quantum-mechanical description of physical reality be considered
    complete?'' Physical Review (1935). Volume/pages (commonly cited Phys. Rev. 47, 777) and DOI: UNVERIFIED in
    this session.'
  access_status: NOT_ACCESSED
  source_accessed_and_checked: false
  supports: 'Background-knowledge only (UNVERIFIED this session): EPR argued that quantum mechanics'' description
    of a two-particle correlated state implies it is incomplete.'
  does_not_establish: Not an experimental result. Did not claim a usable link between people, minds or events; the
    authors meant it as an argument against the completeness of quantum theory.
  category: theory
  marketing_safe_wording: In 1935 Einstein, Podolsky and Rosen published a thought experiment about correlated quantum
    particles that started a long debate in physics.
  cautions: Confirm citation (volume, pages, DOI) against the original before publishing. 'Spooky action at a distance'
    is Einstein's phrase from correspondence, not from the EPR paper; its exact source is UNVERIFIED here.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-02
  subject: Entanglement - Bell 1964
  claim: Bell's theorem proved that separated things stay connected.
  source_citation: Bell, J.S. 'On the Einstein Podolsky Rosen paradox.' Physics 1(3), 195 (1964). Journal/volume/start
    page and 1964 date seen in a search result; end page and DOI UNVERIFIED (a result gave the journal volume range
    195-290, not the paper's own range).
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summary: Bell showed that a local hidden-variable model is incompatible with quantum predictions,
    so locality is the ''essential difficulty''. Also noted: Bell himself mis-cited it as 1965 in a footnote, so
    citations vary 1964/1965.'
  does_not_establish: Does not show that any information, influence or intention travels between distant systems;
    does not address people, minds, groups or organisations.
  category: established_empirical
  marketing_safe_wording: Bell's 1964 theorem showed that quantum correlations cannot be explained by local hidden
    variables, which made the question experimentally testable.
  cautions: Theorem is mathematical; the empirical status comes from later experiments. Use 1964 for the paper date.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-03
  subject: Entanglement - Aspect 1982
  claim: Aspect's experiments proved that particles communicate instantly.
  source_citation: Aspect, A., Dalibard, J., Roger, G. 'Experimental test of Bell's inequalities using time-varying
    analyzers.' Physical Review Letters 49, 1804-1807 (1982). doi:10.1103/PhysRevLett.49.1804 (from search results).
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summary: photon-pair polarisation correlations measured with time-varying analyzers; violation
    of Bell''s inequalities by about 5 standard deviations; settings changed during photon flight (locality loophole
    addressed, with caveat that switching was quasi-periodic, not truly random, as the authors acknowledged).'
  does_not_establish: Does not demonstrate instant communication or any signal; later 'loophole-free' tests were
    needed because loopholes remained in 1982 (detection and setting-independence).
  category: established_empirical
  marketing_safe_wording: Aspect's 1982 experiments with entangled photons found correlations that violate Bell's
    inequalities, in agreement with quantum mechanics.
  cautions: '''Communicate instantly'' is wrong: outcomes are individually random, and nothing usable is transmitted.'
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-04
  subject: Entanglement - 2015 loophole-free Bell tests
  claim: Recent experiments proved Einstein wrong and confirmed that reality is non-local and interconnected.
  source_citation: Hensen, B. et al. 'Loophole-free Bell inequality violation using electron spins separated by
    1.3 kilometres.' Nature 526, 682-686 (2015). doi:10.1038/nature15759; arXiv:1508.05949. (Giles/NIST and Vienna
    groups also reported 2015 loophole-free photon tests - those citations UNVERIFIED here.)
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summary: event-ready entanglement of electron spins in diamond in labs 1.3 km apart on the
    Delft campus; state fidelity 0.92 +/- 0.03; a Bell inequality violated without the extra assumptions of earlier
    tests; follow-up run CHSH 2.35 +/- 0.18, combined S = 2.38 +/- 0.14.'
  does_not_establish: No signalling, no faster-than-light information transfer, nothing about macroscopic objects,
    brains, people or organisations; experiments show specific statistical correlations in carefully prepared microscopic
    systems under cryogenic/lab conditions.
  category: established_empirical
  marketing_safe_wording: In 2015, several groups reported experiments that violated a Bell inequality while closing
    the main experimental loopholes, strengthening the case that no local hidden-variable theory can explain quantum
    correlations.
  cautions: Do not say 'proved Einstein wrong' without nuance (EPR's incompleteness argument vs. locality). Interpretation
    of what the violation implies (non-locality, superdeterminism, many-worlds, etc.) remains debated.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-05
  subject: Entanglement - 2022 Nobel Prize in Physics
  claim: The Nobel Prize confirmed that human consciousness/people are quantum-entangled and that intention shapes
    reality.
  source_citation: Royal Swedish Academy of Sciences, Nobel Prize in Physics 2022 to Alain Aspect, John F. Clauser,
    Anton Zeilinger 'for experiments with entangled photons, establishing the violation of Bell inequalities and
    pioneering quantum information science.' (Official nobelprize.org page NOT fetched; wording taken from search
    results quoting it.)
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: Award citation wording; committee comments pointing to applications in secure information transfer,
    quantum computing and sensing.
  does_not_establish: Nothing about consciousness, interpersonal links, manifestation, healing or business outcomes.
    The prize recognises photon experiments and quantum information science.
  category: established_empirical
  marketing_safe_wording: The 2022 Nobel Prize in Physics honoured experiments with entangled photons that tested
    Bell inequalities and helped found quantum information science.
  cautions: A Nobel is not an endorsement of metaphysical or self-help applications. Verify the citation wording
    on nobelprize.org before quoting.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-06
  subject: Entanglement - no-signalling
  claim: Entangled particles let information or influence pass instantly, so people/teams can be 'entangled' too.
  source_citation: No specific source accessed. Standard result (no-communication theorem); a primary or SEP citation
    was NOT located in this session. Stanford Encyclopedia of Philosophy 'Einstein-Podolsky-Rosen Paradox' / 'Bell's
    Theorem' entries were targeted but unreachable.
  access_status: NOT_ACCESSED
  source_accessed_and_checked: false
  supports: 'Nothing verified in session. Background-knowledge (UNVERIFIED): local measurement outcomes on one side
    of an entangled pair are statistically unaffected by the other side''s choice; correlations appear only when
    results are compared via ordinary channels.'
  does_not_establish: Any evidence for interpersonal, social or consciousness-level entanglement.
  category: established_empirical
  marketing_safe_wording: Quantum entanglement is a feature of carefully prepared microscopic systems and cannot
    be used to send messages; we use it only as a metaphor, not as evidence.
  cautions: Add a verified citation (e.g., SEP, a review of no-signalling) before the claim is used. Keep any entanglement
    language explicitly labelled metaphor.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-07
  subject: Measurement problem / 'observer effect'
  claim: Quantum physics shows that observing something changes it, so your attention/belief changes outcomes.
  source_citation: 'No source fetched. Intended: Stanford Encyclopedia of Philosophy, ''Philosophical Issues in
    Quantum Theory'' / ''Measurement in Quantum Theory''. UNREACHABLE (DNS failure). No substitute located by search.'
  access_status: NOT_ACCESSED
  source_accessed_and_checked: false
  supports: 'Nothing verified. Background-knowledge (UNVERIFIED): in physics, ''observation'' means a physical interaction
    with a measuring device; the measurement problem is the unresolved question of how/why definite outcomes arise
    from the quantum formalism.'
  does_not_establish: That a conscious mind, intention or belief alters outcomes; that observation by people in
    everyday life changes physical results.
  category: debated_hypothesis
  marketing_safe_wording: In physics, 'measurement' means interaction with a detector; how definite outcomes arise
    is still debated, and this does not show that thoughts change external reality.
  cautions: '''Observer effect'' in physics (disturbance by measuring instruments) is different from ''consciousness
    causes collapse''. Keep them separate.'
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-08
  subject: Double-slit experiment
  claim: In the double-slit experiment, particles behave differently when watched, proving consciousness shapes
    reality.
  source_citation: 'No source accessed (no search targeted double-slit specifically). Candidate sources to locate:
    Feynman Lectures on Physics vol. III ch.1; Jonsson 1961 (electrons); Tonomura et al. 1989 (single-electron build-up).
    All citation details UNVERIFIED.'
  access_status: NOT_ACCESSED
  source_accessed_and_checked: false
  supports: 'Nothing verified in session. Background-knowledge (UNVERIFIED): which-path detectors physically interact
    with the particle and remove the interference pattern; this happens with automated detectors and no human watching.'
  does_not_establish: A role for human awareness; that results depend on mental states.
  category: established_empirical
  marketing_safe_wording: In the double-slit experiment, adding a which-path detector removes the interference pattern;
    the effect comes from the physical detector, not from anyone's attention.
  cautions: Do not state this as sourced until a primary/educational citation is added.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-09
  subject: Decoherence
  claim: 'Decoherence explains the observer effect without consciousness / or: decoherence has solved the measurement
    problem.'
  source_citation: 'Intended: Stanford Encyclopedia of Philosophy ''The Role of Decoherence in Quantum Mechanics'';
    Schlosshauer, ''Decoherence, the measurement problem, and interpretations of quantum mechanics'', Rev. Mod.
    Phys. 76 (2004). Both UNVERIFIED/NOT fetched; citation details from memory.'
  access_status: NOT_ACCESSED
  source_accessed_and_checked: false
  supports: 'Nothing verified in session. Background-knowledge (UNVERIFIED): decoherence explains why interference
    becomes unobservable for systems interacting with an environment; whether it fully solves the measurement problem
    (outcome selection) is disputed.'
  does_not_establish: Either that decoherence is irrelevant to the question of mind, or that it settles interpretation.
  category: established_empirical
  marketing_safe_wording: Decoherence describes how quantum systems lose interference through interaction with their
    environment; physicists still debate what it implies for the measurement problem.
  cautions: Confirm Schlosshauer 2004 details before citing.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-10
  subject: Consciousness-causes-collapse (von Neumann-Wigner)
  claim: Leading physicists (von Neumann, Wigner) showed consciousness collapses the wave function.
  source_citation: 'von Neumann, Mathematische Grundlagen der Quantenmechanik (1932); Wigner, ''Remarks on the mind-body
    question'' (1961). Details UNVERIFIED. Survey evidence: Schlosshauer, Kofler, Zeilinger, ''A Snapshot of Foundational
    Attitudes Toward Quantum Mechanics'', arXiv:1301.1069 (2013).'
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summary: the 2013 snapshot polled 33 participants of a quantum-foundations conference (16
    multiple-choice questions); two follow-ups (Norsen & Nelson; Sommer) exist. The specific percentage for consciousness-related
    views was NOT retrieved. Background-knowledge (UNVERIFIED): Wigner later abandoned the view; it is a minority
    position.'
  does_not_establish: That the view is accepted, tested, or supported by experiment. Survey samples are small and
    self-selected.
  category: debated_hypothesis
  marketing_safe_wording: A minority of physicists and philosophers, including von Neumann and (for a time) Wigner,
    discussed the idea that consciousness might play a role in measurement; it is not an experimentally supported
    or mainstream view.
  cautions: Do not claim Wigner's current position without verification. Do not cite survey percentages unless retrieved.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-11
  subject: String theory - status
  claim: String theory shows reality is vibrating energy, so mindset/frequency determines results.
  source_citation: 'Woit, P. ''Not Even Wrong'' (Basic Books, 2006) - described via reviews only; Dawid, ''String
    Theory and the Scientific Method'' (CUP 2013) - not found; ''String Theory: An Evaluation'' arXiv:physics/0102051
    (2001; author UNVERIFIED in search output).'
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summaries: critics (Woit) state string theory has made no experimental prediction; the 2001
    arXiv evaluation says it makes no predictions at experimentally accessible energies. The 2001 date means it
    does not reflect later developments.'
  does_not_establish: A balanced current view (proponents' replies, post-2001 developments) was not retrieved. Nothing
    links string theory to coaching, psychology or organisations.
  category: theory
  marketing_safe_wording: String theory is a mathematical research programme in theoretical physics that has not
    been confirmed by experiment; we do not use it as evidence for our methods.
  cautions: Critics' book is advocacy-leaning; present as one side. Obtain a balanced up-to-date source. 'Everything
    is vibrating strings' is not an established finding.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-12
  subject: Global Neuronal Workspace theory vs IIT - adversarial collaboration
  claim: Science has now shown where consciousness comes from / consciousness is information or field.
  source_citation: Cogitate Consortium et al. 'Adversarial testing of global neuronal workspace and integrated information
    theories of consciousness.' Nature (2025; published ~30 April 2025 per news summaries). Volume/pages/DOI UNVERIFIED.
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summaries: 256 human participants; fMRI, MEG and intracranial EEG; preregistered with proponents''
    input; results aligned with some predictions of each theory while ''substantially challenging key tenets of
    both''; dataset released; second experiment in preparation.'
  does_not_establish: That either theory is correct or refuted overall; no mechanism for coaching or leadership.
    Details of specific predictions failed were not retrieved.
  category: debated_hypothesis
  marketing_safe_wording: A 2025 preregistered adversarial collaboration tested two leading theories of consciousness
    and found results that challenged key claims of both; the science of consciousness remains unsettled.
  cautions: Cite the Nature paper directly after verifying details; news summaries are secondary.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-13
  subject: IIT 'pseudoscience' open letter controversy
  claim: '"IIT is established science" or "IIT has been exposed as pseudoscience."'
  source_citation: Open letter by 124 signatories ('IIT-Concerned'), 2023 (preprint 'The Integrated Information
    Theory of Consciousness as Pseudoscience', Fleming et al. - title/authors/venue UNVERIFIED, from memory). A
    Nautilus essay discussing it was seen only in search results.
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summaries: 124 experts signed a letter critical of IIT and of how the Cogitate results were
    publicised; the dispute arose after initial results were shown at ASSC 2023; the Nautilus authors argue the
    pseudoscience label was unwarranted but also faulted IIT''s defence.'
  does_not_establish: A settled verdict. The year and letter text were not directly accessed (year inferred from
    reports of 2023 events).
  category: debated_hypothesis
  marketing_safe_wording: Integrated Information Theory is contested; in 2023 over a hundred researchers signed
    a letter criticising it, while others defend it as a legitimate theory under test.
  cautions: Describe neutrally; verify the letter's authorship, title and date before citing.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-14
  subject: Reticular activating system - Moruzzi & Magoun 1949
  claim: Your RAS filters what you notice, so setting goals programs it to find opportunities.
  source_citation: Moruzzi, G., Magoun, H.W. 'Brain stem reticular formation and activation of the EEG.' Electroencephalography
    and Clinical Neurophysiology 1, 455-473 (1949). Title/journal/year seen in search results; volume/pages from
    memory, UNVERIFIED.
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summary: brainstem stimulation in cats desynchronised/activated the EEG, resembling arousal.
    A 2010 review (not identified in detail) argues the concept needs revision; activating systems include hypothalamic
    and basal forebrain regions.'
  does_not_establish: That the RAS acts as a goal-driven attention filter, or that written goals reprogram it. Arousal
    and selective attention are distinct systems (secondary source). No direct test of the 'filter' claim was found.
  category: established_empirical
  marketing_safe_wording: Moruzzi and Magoun (1949) showed that the brainstem reticular formation helps regulate
    cortical arousal; how people select what to notice involves other mechanisms.
  cautions: '''RAS filters for your goals'' is a popular extension, not the 1949 finding. Mark as metaphor if used.'
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-15
  subject: '''11 million bits / 40 bits per second'' figures'
  claim: The brain receives 11 million bits per second but the conscious mind processes only 40, so your subconscious
    runs your life.
  source_citation: 'Nørretranders, T. ''The User Illusion: Cutting Consciousness Down to Size'' (Viking, 1998; Danish
    original 1991) - popularised; underlying sensory estimates attributed in secondary sources to Zimmermann (1986
    or 1989 cited inconsistently; exact title/venue UNVERIFIED); also Küpfmüller information-flow diagram (secondary
    source). Britannica (information theory) discusses a ~50 bits/s reading-based estimate.'
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summaries: the ~11 million figure comes from summing rough 1980s sensory-channel capacity
    estimates (vision ~10^7, touch ~10^6, hearing/smell ~10^5, taste ~10^3 bits/s); conscious-rate figures vary
    by source: 16, 40, 50, 60 bits/s. A commentary notes the numbers are not comparable (sensory capacity vs. task-specific
    rate).'
  does_not_establish: That 40 bits is a measured limit of conscious cognition; that the remainder is 'subconscious
    processing' usable for goal-setting. Original Zimmermann text NOT seen; attribution of specific numbers is unverified.
  category: unsupported
  marketing_safe_wording: Popular figures such as '11 million bits' of sensory input versus roughly 40 bits of conscious
    processing are rough, decades-old estimates of uncertain validity; we do not rely on them.
  cautions: Treat as unsupported until the Zimmermann source is read. Multiple inconsistent conscious-rate values
    circulate (16/40/50/60). Avoid precise numbers in marketing.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-16
  subject: Allostatic load (McEwen)
  claim: Chronic stress wears down the body and impairs leadership judgement.
  source_citation: McEwen, B.S. 'Protective and damaging effects of stress mediators.' New England Journal of Medicine
    338(3), 171-179 (1998). doi:10.1056/NEJM199801153380307 (from search results; PMID 9428819).
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summary: review framing allostasis as adaptive response and allostatic load as cumulative
    cost of chronic or dysregulated stress responses; mediators include glucocorticoids and catecholamines; everyday
    stressors contribute. Full text not read.'
  does_not_establish: That any coaching method reduces allostatic load, or that stress impairs specific leadership
    decisions; the review is not a leadership study.
  category: established_empirical
  marketing_safe_wording: Research on allostatic load (McEwen, 1998) describes how prolonged or poorly regulated
    stress responses can carry long-term costs for health.
  cautions: Do not convert into business outcome claims without leadership-specific evidence.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-17
  subject: HRV / vagal tone and decision quality
  claim: High HRV means better decisions; breathing practice raises vagal tone and improves leadership decisions.
  source_citation: (a) Forte et al. 2019 Frontiers in Neuroscience 13:710 (systematic review of HRV and cognition,
    20 studies, N=19,431; per search result). (b) Later systematic review on HRV and decision-making, 15 studies,
    1,051 healthy participants (authors/year/venue UNVERIFIED). (c) Meta-analysis on vagally-mediated HRV and executive
    function, 13 studies, r=.19 (authors/venue UNVERIFIED). (d) Thayer et al. 2009 neurovisceral integration - NOT
    confirmed.
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summaries: small positive correlational association between vagally-mediated HRV and executive
    function (r=.19), larger for inhibition/flexibility than working memory, moderated by measure and age; higher
    HRV tracked with better decision performance, especially under risk, but causal nature ''difficult to clarify''.'
  does_not_establish: Causation; that raising HRV improves decisions; effects in executives or real-world business
    decisions; that consumer HRV devices measure vagal tone accurately. A commentary notes RMSSD/HF reflect vagal
    tone, SDNN does not.
  category: debated_hypothesis
  marketing_safe_wording: Studies find a small positive association between resting heart-rate variability and executive
    function; whether training HRV improves real-world decisions is not established.
  cautions: Correlational evidence. Verify citations (b) and (c) before use.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-18
  subject: Polyvagal theory (Porges) and critiques
  claim: Polyvagal theory explains nervous-system states (fight/flight/freeze/safety) and can be used to coach regulation.
  source_citation: 'Grossman, P. ''Fundamental challenges and likely refutations of the five basic premises of the
    polyvagal theory.'' Biological Psychology 180 (2023); PMID 37230290 (from search). Grossman, P., Taylor, E.W.
    ''Toward understanding respiratory sinus arrhythmia: Relations to cardiac vagal tone, evolution and biobehavioral
    functions.'' Biological Psychology 74(2), 263-285 (2007). Porges''s reply (Porges 2007b, cited via a Qeios critique)
    and a 2026 multi-author Grossman et al. evaluation: UNVERIFIED.'
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summaries: Grossman 2023 argues the five premises are untenable or highly implausible, that
    RSA is not equivalent to cardiac vagal tone, and disputes claims about dorsal vagal motor nucleus and bradycardia.
    A commentary describes polyvagal approaches as ''scientifically questionable but useful in practice'' (opinion).
    Porges has responded.'
  does_not_establish: The final resolution of the dispute; Porges's side was not read. Does not show that practices
    used in polyvagal-informed work are ineffective.
  category: debated_hypothesis
  marketing_safe_wording: Polyvagal theory is influential in clinical and coaching circles but its core physiological
    claims are disputed in the peer-reviewed literature.
  cautions: Mark CONTESTED. Do not present polyvagal states as established physiology. Check Porges's published
    replies for balance.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-19
  subject: Deliberate practice vs 10,000 hours
  claim: 10,000 hours of practice makes you an expert at anything.
  source_citation: Ericsson, K.A., Krampe, R.Th., Tesch-Romer, C. 'The role of deliberate practice in the acquisition
    of expert performance.' Psychological Review 100(3), 363-406 (1993) (title, journal, year confirmed in search;
    page range from memory, UNVERIFIED). Macnamara, Hambrick, Oswald 2014 Psychological Science (meta-analysis);
    Ericsson-group 2019 Frontiers in Psychology review (doi 10.3389/fpsyg.2019.02396 per URL).
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summaries: the 1993 study of violinists/musicians defined deliberate practice as individualised,
    teacher-directed solitary practice; best musicians averaged ~10,000 hours by age 20 vs 2,000-5,000 for less
    accomplished; Gladwell''s ''Outliers'' popularised a ''10,000-hour rule'' not in the research; Macnamara 2014
    reports practice explaining roughly 20-25% of performance variance in music, sports and games (figure from press
    write-up); a sports meta-analysis ~18%; Ericsson''s camp disputes the meta-analysis.'
  does_not_establish: A fixed threshold; that deliberate practice applies to leadership without domain-specific
    evidence; that practice time alone predicts success.
  category: established_empirical
  marketing_safe_wording: Research on deliberate practice (Ericsson et al., 1993) shows structured, feedback-rich
    practice matters for expertise; the '10,000-hour rule' is a popular simplification, and practice explains only
    part of performance differences.
  cautions: Do not attribute the 10,000-hour rule to Ericsson. Check exact variance figures in Macnamara 2014.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-20
  subject: Dopamine reward prediction (Schultz)
  claim: Dopamine is the pleasure chemical; you get more of it from pursuing than arriving.
  source_citation: Schultz, W., Dayan, P., Montague, P.R. 'A neural substrate of prediction and reward.' Science
    275, 1593-1599 (1997) (confirmed via search results).
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summary/abstract text: dopamine neuron activity in primates appears to track errors in predictions
    of future reward, consistent with reinforcement-learning theory.'
  does_not_establish: That dopamine encodes pleasure; that pursuit is inherently more rewarding than achievement;
    anything about humans' goal-pursuit satisfaction or coaching. Wanting vs liking (Berridge) was mentioned only
    from the search tool's own background knowledge and not sourced.
  category: established_empirical
  marketing_safe_wording: Research by Schultz and colleagues found that dopamine neurons in primates signal reward
    prediction errors, a learning signal rather than a simple 'pleasure' signal.
  cautions: Avoid 'pursuit over arrival' as a finding; it is an extrapolation. Primate single-neuron data; human
    generalisation needs separate sources.
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-21
  subject: Present-tense written declaration processed like lived experience
  claim: The brain processes a vividly written present-tense declaration as if it were real experience, rewiring
    your identity.
  source_citation: 'No direct source found. Related: Wood, J.V., Perunovic, W.Q.E., Lee, J.W. ''Positive self-statements:
    Power for some, peril for others.'' Psychological Science 20, 860-866 (2009); PMID 19493324 (confirmed in search).'
  access_status: SEARCH_SNIPPET_ONLY
  source_accessed_and_checked: false
  supports: 'Per search summary: in experiments, repeating ''I''m a lovable person'' made people with low self-esteem
    feel worse than controls and helped those with high self-esteem only modestly (mostly university students).'
  does_not_establish: Any evidence of equivalence between declarations and lived experience in the brain; the study
    neither tests nor supports that claim. No supporting neuroimaging study was found in this session.
  category: unsupported
  marketing_safe_wording: Some people find written intentions useful; research suggests positive self-statements
    can backfire for people with low self-esteem, so we describe this as a reflective exercise, not a brain-rewiring
    mechanism.
  cautions: Treat the brain-equivalence claim as unsupported. Consider evidence on imagery/implementation intentions
    separately (not searched).
  external_marketing_status: hold-until-citation-verified-against-original
- id: RA-22
  subject: REM sleep 'rehearses' evening declarations
  claim: Reading your declaration before bed means REM sleep rehearses it overnight.
