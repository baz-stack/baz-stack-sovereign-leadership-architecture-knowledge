founder_approval_required: Sending any message; activating any workflow; changing a live CRM; contacting any person
output_must_include:
- document IDs and versions relied on
- open conflict IDs touched
- evidence class for each factual claim
conflict_behaviour: flag discrepancy, do not choose
status: current
version: 2026.10.16.1
visibility: public
export_safe_documents:
- restricted/campaigns/PROSPECTING_EXPORT_PACKET.md
